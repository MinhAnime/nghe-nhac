name: Deploy production

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nghenhac-production-deployment
  cancel-in-progress: false

env:
  DEPLOY_ROOT: /home/minhduong/nghe-nhac
  DEPLOY_SHA: ${{ github.sha }}

jobs:
  deploy-app:
    name: Deploy nghe-nhac-app
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30

    steps:
      - name: Prepare repository
        id: revision
        shell: bash
        run: |
          set -euo pipefail

          REPO_URL="${{ github.server_url }}/${{ github.repository }}.git"

          if [ ! -d "$DEPLOY_ROOT/.git" ]; then
            echo "Repository not found. Cloning..."
            git clone "$REPO_URL" "$DEPLOY_ROOT"
          fi

          cd "$DEPLOY_ROOT"

          git fetch --prune origin

          remote_sha=$(git rev-parse origin/master)

          if [[ "$remote_sha" != "$DEPLOY_SHA" ]]; then
            echo "A newer commit exists on master."
            echo "Skip obsolete deployment."

            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git reset --hard "$DEPLOY_SHA"
          git clean -fd

          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Show deployed revision
        if: steps.revision.outputs.deploy == 'true'
        shell: bash
        run: |
          cd "$DEPLOY_ROOT"
          echo "Deploying commit:"
          git log -1 --oneline

      - name: Validate Docker Compose
        if: steps.revision.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_ROOT"

          docker compose config --quiet

      - name: Build Docker images
        if: steps.revision.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_ROOT"

          docker compose build

      - name: Deploy containers
        if: steps.revision.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_ROOT"

          docker compose up \
            -d \
            --remove-orphans \
            --wait \
            --wait-timeout 600

      - name: Verify application health
        if: steps.revision.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Spring Boot..."

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:20080/actuator/health >/dev/null; then
              echo "Application is UP"
              exit 0
            fi

            sleep 5
          done

          echo "Health check failed."
          exit 1

      - name: Show Docker status
        if: always()
        shell: bash
        run: |
          cd "$DEPLOY_ROOT"

          docker compose ps

      - name: Dump Docker logs on failure
        if: failure()
        shell: bash
        run: |
          cd "$DEPLOY_ROOT"

          docker compose logs --tail=300

      - name: Cleanup dangling images
        if: always()
        shell: bash
        run: |
          docker image prune -f