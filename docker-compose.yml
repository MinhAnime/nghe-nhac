version: '3.8'

services:
  nghenhac-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nghenhac-app
    restart: always
    ports:
      - "8086:8080" # Đổi host port từ 8080 thành 8086 để tránh trùng cổng với app khác trên Server
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"

