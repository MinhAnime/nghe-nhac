spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nghenhac}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

r2:
  endpoint: ${R2_ENDPOINT:http://localhost:9000}
  access-key: ${R2_ACCESS_KEY:minioadmin}
  secret-key: ${R2_SECRET_KEY:minioadmin}
  bucket:
    songs: ${R2_BUCKET_SONGS:songs}
    covers: ${R2_BUCKET_COVERS:covers}

jwt:
  secret: ${JWT_SECRET:9aF3cK2sP7qR8vW4xY0zB1aC5dE6fG7hI8jK9lM0nO1pQ2rS3tU4vW5xY6zA7bC8}
